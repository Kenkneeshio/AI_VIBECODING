<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" role="img" aria-labelledby="title desc">
  <title id="title">Ishioho single-car garage</title>
  <desc id="desc">Top-down storybook plan. The roll-up garage opening faces the driveway at the top. Beside the left pedestrian door, the stairs descend toward the top of the image from the upstairs porch at the bottom. The right and bottom walls have no openings.</desc>
  <defs>
    <pattern id="pavers" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#c4ab86"/>
      <path d="M0 0H26M0 13H26M13 0V13M0 13V26M26 13V26" fill="none" stroke="#a88a67" stroke-width="1" opacity=".58"/>
    </pattern>
    <pattern id="floor" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#d6c49e"/>
      <path d="M0 0H32M0 16H32M16 0V16M0 16V32M32 16V32" fill="none" stroke="#baa57f" stroke-width="1.3" opacity=".62"/>
    </pattern>
    <pattern id="steps" width="70" height="23" patternUnits="userSpaceOnUse">
      <rect width="70" height="23" fill="#a78c71"/>
      <path d="M0 2H70M0 19H70" stroke="#ead7aa" stroke-width="4"/>
      <path d="M0 23H70" stroke="#6d5846" stroke-width="3"/>
    </pattern>
    <pattern id="garage-slat" width="20" height="9" patternUnits="userSpaceOnUse">
      <rect width="20" height="9" fill="#d7c3a1"/>
      <path d="M0 8H20" stroke="#8f765c" stroke-width="2"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-20%" width="135%" height="145%">
      <feDropShadow dx="5" dy="6" stdDeviation="2" flood-color="#3c4638" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Exterior: one internal driveway north of the building. -->
  <rect width="660" height="430" fill="#91a974"/>
  <path d="M0 0H660V103H0Z" fill="#66716f"/>
  <path d="M0 17H660M0 86H660" stroke="#89928a" stroke-width="3"/>
  <path d="M0 52H660" stroke="#e4d7a8" stroke-width="4" stroke-dasharray="36 24" opacity=".88"/>
  <rect x="438" y="9" width="176" height="28" rx="5" fill="#f0dcab" stroke="#76583f" stroke-width="3"/>
  <text x="526" y="28" text-anchor="middle" fill="#594332" font-family="sans-serif" font-size="14" font-weight="800" letter-spacing="1">DRIVEWAY · TOP</text>
  <rect x="0" y="102" width="660" height="27" fill="url(#pavers)"/>
  <path d="M0 128H660" stroke="#70563e" stroke-width="5"/>

  <!-- Planted exterior stair: descend screen-up toward the driveway; the upstairs porch is off the lower edge. -->
  <path d="M31 109H168V402H31Z" fill="#5d473a" filter="url(#shadow)"/>
  <path d="M42 119H156V391H42Z" fill="url(#pavers)"/>
  <path d="M56 137H142V372H56Z" fill="url(#steps)" stroke="#654e3e" stroke-width="4"/>
  <path d="M49 136V376M150 136V376" stroke="#3d4840" stroke-width="6"/>
  <path d="M48 145H55M48 169H55M48 193H55M48 217H55M48 241H55M48 265H55M48 289H55M48 313H55M48 337H55M48 361H55M143 145H151M143 169H151M143 193H151M143 217H151M143 241H151M143 265H151M143 289H151M143 313H151M143 337H151M143 361H151" stroke="#96a796" stroke-width="3"/>
  <path d="M99 280V191" stroke="#f9eab9" stroke-width="10" stroke-linecap="square"/>
  <path d="M76 211L99 183L122 211" fill="none" stroke="#f9eab9" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="47" y="377" width="108" height="22" rx="3" fill="#ead6a4" stroke="#6b523f" stroke-width="3"/>
  <text x="101" y="392" text-anchor="middle" fill="#59422e" font-family="sans-serif" font-size="13" font-weight="800">UP TO PORCH</text>
  <text x="101" y="128" text-anchor="middle" fill="#f7e6bd" font-family="sans-serif" font-size="11" font-weight="700">DOWN TO 1F ↑</text>

  <!-- A small path connects the west pedestrian door with the stair. -->
  <path d="M159 293H192" stroke="#e1c69c" stroke-width="34"/>
  <path d="M159 282H191M159 304H191" stroke="#a78865" stroke-width="2"/>
  <path d="M166 293H184" stroke="#826b4d" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- One-car bay. The north wall is interrupted only for the roll-up door. -->
  <path d="M178 104H627V410H178Z" fill="#594b3c" opacity=".28" transform="translate(6 6)"/>
  <path d="M178 104H627V410H178Z" fill="url(#floor)" stroke="#554234" stroke-width="7"/>
  <path d="M180 107H248M551 107H625M180 107V274M180 326V410H625V107" fill="none" stroke="#7b5940" stroke-width="22" stroke-linecap="square"/>
  <path d="M180 107H248M551 107H625M180 107V274M180 326V410H625V107" fill="none" stroke="#e7c895" stroke-width="11" stroke-linecap="square"/>
  <path d="M248 100V122M551 100V122" stroke="#4e3a30" stroke-width="11"/>
  <path d="M252 117H548" stroke="#705441" stroke-width="5"/>
  <rect x="253" y="84" width="293" height="20" rx="3" fill="url(#garage-slat)" stroke="#624b38" stroke-width="4"/>
  <path d="M248 96H550" stroke="#f7dd9e" stroke-width="3" stroke-dasharray="8 4"/>
  <path d="M265 126H538" stroke="#ede2bd" stroke-width="9" opacity=".8"/>
  <text x="401" y="71" text-anchor="middle" fill="#fff3cf" stroke="#5c4735" stroke-width="3" paint-order="stroke" font-family="sans-serif" font-size="16" font-weight="900" letter-spacing="1">ROLL-UP ↑</text>

  <!-- Left/west pedestrian opening. There are no east or south doors. -->
  <path d="M180 274V326" stroke="#d9c5a0" stroke-width="7"/>
  <path d="M181 274H220" stroke="#624c3b" stroke-width="6"/>
  <path d="M181 274A39 39 0 0 0 220 313" fill="none" stroke="#9e795a" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="212" cy="278" r="3" fill="#f1d898"/>
  <rect x="148" y="322" width="112" height="25" rx="4" fill="#f2ddad" stroke="#72523c" stroke-width="3"/>
  <text x="204" y="339" text-anchor="middle" fill="#614632" font-family="sans-serif" font-size="12" font-weight="800">SIDE DOOR ←</text>

  <!-- Parked car faces the top/north opening. -->
  <ellipse cx="399" cy="265" rx="108" ry="145" fill="#665d46" opacity=".25"/>
  <rect x="307" y="163" width="21" height="62" rx="7" fill="#3e3a36"/>
  <rect x="472" y="163" width="21" height="62" rx="7" fill="#3e3a36"/>
  <rect x="307" y="320" width="21" height="57" rx="7" fill="#3e3a36"/>
  <rect x="472" y="320" width="21" height="57" rx="7" fill="#3e3a36"/>
  <path d="M348 151Q400 133 452 151L476 191V335Q469 373 446 383H354Q331 373 324 335V191Z" fill="#4d7a71" stroke="#344c48" stroke-width="7" filter="url(#shadow)"/>
  <path d="M349 157Q400 145 451 157L462 183H338Z" fill="#80aaa2" stroke="#bdd5bc" stroke-width="4"/>
  <path d="M345 199H455L468 253H332Z" fill="#2d5660" stroke="#c6decf" stroke-width="4"/>
  <path d="M345 208H454" stroke="#a6c2bc" stroke-width="5" opacity=".6"/>
  <path d="M338 275H462V331H338Z" fill="#5d8c7f" stroke="#345a55" stroke-width="4"/>
  <path d="M348 353H452" stroke="#b6d2b6" stroke-width="5"/>
  <rect x="337" y="150" width="29" height="10" rx="2" fill="#ffe5a7"/>
  <rect x="434" y="150" width="29" height="10" rx="2" fill="#ffe5a7"/>
  <rect x="340" y="369" width="24" height="9" rx="2" fill="#d47465"/>
  <rect x="436" y="369" width="24" height="9" rx="2" fill="#d47465"/>
  <path d="M327 194L310 211M473 194L490 211" stroke="#344c48" stroke-width="7" stroke-linecap="round"/>

  <!-- A narrow storage wall keeps the scene lived-in without inventing exits. -->
  <path d="M521 184H601V257H521Z" fill="#9f724c" stroke="#5d4634" stroke-width="5"/>
  <path d="M529 188V254M564 188V254M522 221H599" stroke="#593f31" stroke-width="4"/>
  <rect x="535" y="195" width="18" height="20" fill="#d6b477" stroke="#654b39" stroke-width="3"/>
  <rect x="571" y="195" width="18" height="20" fill="#8ea178" stroke="#654b39" stroke-width="3"/>
  <rect x="536" y="229" width="50" height="14" fill="#cc9b66" stroke="#654b39" stroke-width="3"/>
  <path d="M523 315H605V369H523Z" fill="#ad7b50" stroke="#614735" stroke-width="5"/>
  <path d="M537 315V369M589 315V369M524 342H603" stroke="#765239" stroke-width="3"/>
  <rect x="543" y="307" width="44" height="14" rx="2" fill="#e3bf85" stroke="#765239" stroke-width="3"/>
  <path d="M553 314H576" stroke="#7a6548" stroke-width="3"/>
  <text x="402" y="400" text-anchor="middle" fill="#f4e0ad" stroke="#604933" stroke-width="2" paint-order="stroke" font-family="sans-serif" font-size="13" font-weight="800" letter-spacing="1">ONE CAR · BELOW THE HOME</text>

  <!-- Small planting along the lane makes the garage scene match the house art. -->
  <path d="M640 129V395" stroke="#6a8057" stroke-width="14" stroke-linecap="round"/>
  <circle cx="645" cy="158" r="17" fill="#3f7751" stroke="#30563e" stroke-width="4"/>
  <circle cx="634" cy="187" r="16" fill="#5d925f" stroke="#30563e" stroke-width="4"/>
  <circle cx="645" cy="218" r="20" fill="#477a52" stroke="#30563e" stroke-width="4"/>
  <circle cx="639" cy="258" r="16" fill="#5b965d" stroke="#30563e" stroke-width="4"/>
  <circle cx="647" cy="302" r="19" fill="#487a51" stroke="#30563e" stroke-width="4"/>
  <circle cx="639" cy="341" r="17" fill="#5f9562" stroke="#30563e" stroke-width="4"/>
  <circle cx="648" cy="375" r="17" fill="#477951" stroke="#30563e" stroke-width="4"/>
  <g fill="#f4ddaa">
    <circle cx="650" cy="166" r="4"/><circle cx="631" cy="187" r="4"/><circle cx="648" cy="228" r="4"/><circle cx="641" cy="296" r="4"/><circle cx="648" cy="365" r="4"/>
  </g>
</svg>
